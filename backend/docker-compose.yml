# Local/dev stack: a one-shot migration, then the API, against the Postgres at
# DATABASE_URL. This mirrors the systemd flow (migrate runs before the API
# serves traffic) without starting a database container. For production on the
# VPS, prefer the systemd unit in deploy/.
#
#   cd backend
#   cp .env.example .env        # fill in the required values
#   docker compose up --build
#
# Values below compose from backend/.env (for interpolation). DATABASE_URL and
# JWT_SECRET must be set explicitly (a known JWT default would let anyone forge
# session tokens). Anonymous sign-in works once they are; Google sign-in needs
# a real GOOGLE_WEB_CLIENT_ID.
#
# Inside a container, "localhost" is the container itself, not the host. When
# Postgres runs on the Docker host, point DATABASE_URL at host.docker.internal
# (mapped below) instead of localhost.
#
# API: http://localhost:8080   Health: http://localhost:8080/healthz

x-db-url: &db-url ${DATABASE_URL:?set DATABASE_URL in backend/.env or the environment}

services:
  # Applies the embedded migrations, then exits. The API waits for it to
  # succeed, so a fresh database is always migrated before the api starts.
  migrate:
    build: .
    image: weight-buddy
    entrypoint: ["/app/weight-buddy-migrate", "up"]
    environment:
      DATABASE_URL: *db-url
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  api:
    build: .
    image: weight-buddy
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *db-url
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in backend/.env or the environment}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-dev.apps.googleusercontent.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:-}
      DAILY_SPEND_CAP_USD: ${DAILY_SPEND_CAP_USD:-25}
      # Optional. Empty leaves /admin unregistered.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Force-update gate. Keep the minimum at 1.0.0 until an old build retires.
      MIN_APP_VERSION: ${MIN_APP_VERSION:-1.0.0}
      APP_STORE_URL: ${APP_STORE_URL:-https://play.google.com/store/apps/details?id=com.tedif.weight_buddy}
      APP_UPDATE_MESSAGE: ${APP_UPDATE_MESSAGE:-Update Weight Buddy to keep logging your meals and workouts.}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
